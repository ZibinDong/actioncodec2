extends: base.yaml
tokenizer:
  name: fast
  processor: physical-intelligence/fast
  revision: ec4d7aa71691cac0b8bed6942be45684db2110f4
  # Decode without the grammar mask, as FAST is normally used: a stream that does
  # not parse becomes a zero action.  Set true to mask illegal ids.
  constrained_decoding: false
  normalizer:
    low: [-0.0661633238, -0.0557859652, -0.0696641728, -0.0572056770, -0.0823523626, -0.0791488588, -0.0769436955, 0.0]
    high: [0.0662442893, 0.0652041361, 0.0690458342, 0.0567845106, 0.0819745585, 0.0804257393, 0.0773761719, 1.0]
train:
  output_dir: outputs/train/droid/fast
