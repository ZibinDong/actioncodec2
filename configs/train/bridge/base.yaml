# G0.5 on Bridge (original LeRobot release): 5 Hz, one camera, ten future actions.
model:
  proprio_mode: none
  embodiment: Bridge
  action_dim: 7
  action_only_loss: true
data:
  roots:
    - bridge_orig_lerobot
  horizon: 10
  control_frequency_hz: 5
  translation_meters_per_unit: 1.0
  rotation_radians_per_unit: 1.0
  action_space: delta_eef
  action_rotation_representation: euler_xyz
  gripper_threshold: 0.9
  gripper_open_is_high: true
  video_keys: [observation.images.image_0]
  require_nonempty_task: false
  execution_stride: 5
  lanes: 16
  sample_order: random
  token_cache: auto
train:
  output_dir: outputs/train/bridge
  steps: 50000
  # Fixed so ``--steps`` can stop a run early on the same 50k LR schedule.
  schedule_steps: 50000
  batch_size: 2
  gradient_accumulation: 4
  learning_rate: 0.00005
  warmup_steps: 1000
  save_every: 5000
  num_workers: 4
tracking:
  backend: none
