extends: base.yaml
tokenizer:
  name: actioncodec2
  artifact: ZibinDong/ActionCodec2
  revision: v0.1.0
  variant: paper-o1-5mm-4k-2bin-1p2ms
  variant_fingerprint: 800d30570a3b350517596e3099c1bb79be6bdba0e65db0244fb612f0b055bf3b
  action_space: delta_eef
  target_hz: 15
  rotation_multiplication: left
  motion_scale: [0.05, 0.05, 0.05, 0.5, 0.5, 0.5]
  gripper_threshold: 0.5
  gripper_open_is_high: false  # the codec's input convention, not the dataset's
data:
  split: train
  # Deployment executes the first 10 of every 20 actions, the formal LIBERO protocol.
  execution_stride: 10
train:
  output_dir: outputs/train/libero/actioncodec2
  batch_size: 16
  gradient_accumulation: 1
