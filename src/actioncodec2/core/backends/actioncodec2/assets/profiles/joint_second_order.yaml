        start: 0
        stop: 7
      space: additive
      input_order: 0
      primitive_order: 2
      input_transform:
        scale: 1.0
        clip: false
      constraints:
        order_0:
          min: -6.283185307179586
          max: 6.283185307179586
        order_2:
          min: -0.25
          max: 0.25
        order_1:
          min: -0.35
          max: 0.35
      distortion_limit:
      - 0.004
      - 0.004
      - 0.006
      - 0.0075
      - 0.015
      - 0.02
      - 0.02
      primitive_selection: smooth
    gripper_open_command:
      dims:
      - 7
      space: additive
      input_order: 0
      primitive_order: 0
      input_transform:
        scale: 1.0
        clip: true
      constraints:
        order_0:
          min: 0.0
          max: 1.0
      distortion_limit: 0.5
      primitive_selection: nearest
set_bpe:
